name: Release Windows Build

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag (e.g. v1.0.0)'
        required: true
        default: 'v1.0.0'

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Determine version tag
        id: ver
        shell: pwsh
        run: |
          if ("${{ github.event_name }}" -eq "workflow_dispatch") {
            $tag = "${{ inputs.tag }}"
          } else {
            $tag = "${{ github.ref_name }}"
          }
          $clean = $tag.TrimStart('v', 'V')
          "tag=$tag" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          "version=$clean" | Out-File -FilePath $env:GITHUB_OUTPUT -Append

      - name: Build and package Windows release
        shell: powershell
        run: |
          .\package.ps1 -Version "${{ steps.ver.outputs.version }}"

      - name: Smoke-test offscreen shader render (WARP/GPU)
        shell: powershell
        run: |
          $outPng = Join-Path $env:RUNNER_TEMP 'smoke_miami.png'
          & .\dist\NeonHorizonWallpaper.exe --test-render $outPng miami_drive | Out-String
          if ($LASTEXITCODE -ne 0 -or -not (Test-Path $outPng)) { throw "Smoke render PNG was not created" }
          $outPng2 = Join-Path $env:RUNNER_TEMP 'smoke_neon.png'
          & .\dist\NeonHorizonWallpaper.exe --test-render $outPng2 neon_horizon | Out-String
          if ($LASTEXITCODE -ne 0 -or -not (Test-Path $outPng2)) { throw "Smoke render PNG2 was not created" }

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: pwsh
        run: |
          $tag = "${{ steps.ver.outputs.tag }}"
          $ver = "${{ steps.ver.outputs.version }}"
          $zip = "dist/NeonHorizonWallpaper-v$ver-win.zip"
          $exe = "dist/NeonHorizonWallpaper.exe"
          $sha = "dist/checksums-sha256.txt"
          $notesPath = Join-Path $env:RUNNER_TEMP 'release_notes.md'
          $lines = @(
            "## Neon Horizon — Live Synthwave & CRT/VHS Desktop Wallpaper ($tag)",
            "",
            "Нативные живые обои для Windows 10 / Windows 11 (включая 24H2) на Direct3D 11 + DirectComposition + HLSL:",
            "- Две процедурные сцены на выбор: **Neon Horizon** и **Miami Sunset Drive** (суперкар в своей полосе, встречные легковушки и фуры, пролетающие пальмы и скайлайн Майами).",
            "- Двухпроходный CRT/VHS-шейдер: скруглённая ЭЛТ-рамка, сканлайны с привязкой к DPI, RGB-решётка, Bloom, VHS-хроматика, зерно и полоса развёртки.",
            "- Управление из системного трея, панель настроек и автопауза при полноэкранных приложениях.",
            "",
            "### Загрузка и запуск",
            "- Скачайте **`NeonHorizonWallpaper.exe`** (полностью автономный одиночный файл) или **`NeonHorizonWallpaper-v$ver-win.zip`**.",
            "- Запустите `NeonHorizonWallpaper.exe` — иконка появится в системном трее (двойной клик открывает настройки)."
          )
          [System.IO.File]::WriteAllLines($notesPath, $lines)
          gh release create $tag $zip $exe $sha `
            --title "Neon Horizon Wallpaper $tag (Windows)" `
            --notes-file $notesPath
