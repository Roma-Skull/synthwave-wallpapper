name: Release Windows Build

on:
  push:
    tags:
      - 'windows-v*'
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Windows release tag (e.g. windows-v1.1.0)'
        required: true
        default: 'windows-v1.1.0'

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Determine Windows version tag
        id: ver
        shell: pwsh
        run: |
          if ("${{ github.event_name }}" -eq "workflow_dispatch") {
            $tag = "${{ inputs.tag }}"
          } else {
            $tag = "${{ github.ref_name }}"
          }
          $clean = $tag -replace '^(?:[a-zA-Z0-9_-]+-)?[vV]', ''
          "tag=$tag" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          "version=$clean" | Out-File -FilePath $env:GITHUB_OUTPUT -Append

      - name: Build and package Windows release
        shell: powershell
        run: |
          .\package.ps1 -Version "${{ steps.ver.outputs.version }}"

      - name: Smoke-test offscreen shader renders (WARP/GPU)
        shell: powershell
        run: |
          foreach ($scene in @('neon_horizon', 'miami_drive', 'light_cycle')) {
            $outPng = Join-Path $env:RUNNER_TEMP "smoke_$scene.png"
            & .\dist\NeonHorizonWallpaper-windows.exe --test-render $outPng $scene 1280 720 | Out-String
            if ($LASTEXITCODE -ne 0 -or -not (Test-Path $outPng)) {
              throw "Smoke render PNG was not created for scene $scene"
            }
          }

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: pwsh
        run: |
          $tag = "${{ steps.ver.outputs.tag }}"
          $ver = "${{ steps.ver.outputs.version }}"
          $zip = "dist/NeonHorizonWallpaper-v$ver-windows.zip"
          $exe = "dist/NeonHorizonWallpaper-windows.exe"
          $sha = "dist/checksums-windows-sha256.txt"
          $man = "dist/manifest-windows.json"
          $notesPath = Join-Path $env:RUNNER_TEMP 'release_notes.md'
          $lines = @(
            "## Neon Horizon — Windows Live Desktop Wallpaper (v$ver)",
            "",
            "Платформа: **Windows 10 / Windows 11 (включая 24H2+)** — нативный Direct3D 11 + DirectComposition + HLSL рендер.",
            "",
            "- Три процедурные сцены: **Neon Horizon**, **Miami Sunset Drive** и **Light Cycle (TRON)**.",
            "- Двухпроходный CRT/VHS-шейдер с поддержкой произвольных соотношений сторон и DPI.",
            "- Встроенный модуль автообновления из GitHub Releases с проверкой SHA-256.",
            "",
            "### Загрузка и запуск",
            "- Скачайте **`NeonHorizonWallpaper-windows.exe`** (одиночный автономный файл) или **`NeonHorizonWallpaper-v$ver-windows.zip`**.",
            "- Запустите — иконка появится в системном трее (двойной клик открывает настройки)."
          )
          [System.IO.File]::WriteAllLines($notesPath, $lines)
          gh release create $tag $zip $exe $sha $man `
            --title "Neon Horizon Wallpaper v$ver [Windows]" `
            --notes-file $notesPath
