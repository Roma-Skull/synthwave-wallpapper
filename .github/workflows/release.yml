name: Release Windows Build

on:
  push:
    tags:
      - 'windows-v*'
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Windows release tag (e.g. windows-v1.3.0)'
        required: true
        default: 'windows-v1.3.0'

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Determine Windows version tag
        id: ver
        shell: pwsh
        run: |
          if ("${{ github.event_name }}" -eq "workflow_dispatch") {
            $tag = "${{ inputs.tag }}"
          } else {
            $tag = "${{ github.ref_name }}"
          }
          $clean = $tag -replace '^(?:[a-zA-Z0-9_-]+-)?[vV]', ''
          "tag=$tag" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          "version=$clean" | Out-File -FilePath $env:GITHUB_OUTPUT -Append

      - name: Build and package Windows release
        shell: powershell
        run: |
          .\windows\package.ps1 -Version "${{ steps.ver.outputs.version }}"

      - name: Smoke-test offscreen shader renders (WARP/GPU)
        shell: powershell
        run: |
          foreach ($scene in @('neon_horizon', 'miami_drive', 'light_cycle', 'outrun_cycle')) {
            $outPng = Join-Path $env:RUNNER_TEMP "smoke_$scene.png"
            & .\windows\dist\NeonHorizonWallpaper-windows.exe --test-render $outPng $scene 1280 720 | Out-String
            if ($LASTEXITCODE -ne 0 -or -not (Test-Path $outPng)) {
              throw "Smoke render PNG was not created for scene $scene"
            }
          }

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: pwsh
        run: |
          $tag = "${{ steps.ver.outputs.tag }}"
          $ver = "${{ steps.ver.outputs.version }}"
          $zip = "windows/dist/NeonHorizonWallpaper-v$ver-windows.zip"
          $exe = "windows/dist/NeonHorizonWallpaper-windows.exe"
          $sha = "windows/dist/checksums-windows-sha256.txt"
          $man = "windows/dist/manifest-windows.json"
          $notesPath = Join-Path $env:RUNNER_TEMP 'release_notes.md'
          $lines = @(
            "## Neon Horizon — Windows Live Desktop Wallpaper (v$ver)"
            ''
            'Нативные живые обои для рабочего стола **Windows 10 / Windows 11 (включая 24H2+)** напрямую на **Direct3D 11 + DirectComposition + HLSL** — без браузерного движка и сторонних лаунчеров.'
            ''
            "### Что нового в v$ver"
            '- **Оптимизация HLSL-шейдеров и снижение нагрузки на GPU:** облегчены проходы отражений, скруглённых лент и каркасных гор в `Light Cycle` и `Outrun Cycle` (минус ~38–42% инструкций и ~65–70% `sqrt`), добавлены ранние отсечения в `Miami Sunset Drive`, а **Bloom** в `crt_vhs` переведён на 6 сэмплов без тригонометрии и лишних `ClearRenderTargetView`.'
            '- **24 FPS и Grid speed 50% по умолчанию:** добавлен вариант `24 FPS` (по умолчанию) и спокойная базовая скорость движения `50%`.'
            '- **Масштаб 1-го прохода сцены 60%:** проход сцены рендерится в `60%` разрешения (минус 64% пикселей на тяжёлом процедурном шейдере, идеально для `1920×1200`, `4K` и `5120×2160`), а 2-й проход CRT/VHS и сканлайны рисуются в полном нативном разрешении.'
            ''
            '### Основные возможности'
            '- **4 процедурные сцены:** **Neon Horizon**, **Miami Sunset Drive**, **Light Cycle** и **Outrun Cycle**.'
            '- **Двухпроходный CRT/VHS-шейдер:** бочкообразный изгиб экрана, чересстрочный сканлайн и RGB-решётка с привязкой к DPI, Bloom-свечение, VHS-глитчи и виньетка.'
            '- **Любые соотношения сторон:** `16:9`, `16:10`, `21:9`, `32:9`, `4:3`, `1:1`, портретные `9:16`, `9:21` и мультимониторность.'
            '- **Автообновление и экономия ресурсов:** `24 FPS` по умолчанию, рендер сцены в `60%`, автопауза в полноэкранных играх/приложениях и встроенный апдейтер через GitHub Releases с проверкой SHA-256.'
            ''
            '### Загрузка и запуск'
            "- Скачайте **`NeonHorizonWallpaper-windows.exe`** (одиночный автономный файл) или **`NeonHorizonWallpaper-v$ver-windows.zip`**."
            '- Запустите — иконка появится в системном трее (двойной клик открывает панель настроек).'
          )
          $utf8NoBom = New-Object System.Text.UTF8Encoding($false)
          [System.IO.File]::WriteAllLines($notesPath, $lines, $utf8NoBom)

          $releaseTitle = "Neon Horizon Wallpaper v$ver [Windows]"
          $oldEap = $ErrorActionPreference
          $ErrorActionPreference = 'Continue'
          try {
            gh release view $tag 2>$null | Out-Null
            $releaseExists = ($LASTEXITCODE -eq 0)
          } finally {
            $ErrorActionPreference = $oldEap
          }

          if ($releaseExists) {
            gh release upload $tag $zip $exe $sha $man --clobber
            gh release edit $tag --title $releaseTitle --notes-file $notesPath
          } else {
            gh release create $tag $zip $exe $sha $man `
              --title $releaseTitle `
              --notes-file $notesPath
          }
